[workspace]
members = [
    "spark-lib",
    "build-lod",
    "build-lod-unity",
    "gsplat-convert-ffi",
]
# build-lod is vendored for reference only (its default `gpu` feature pulls in
# wgpu); plain `cargo build` skips it.
default-members = [
    "spark-lib",
    "build-lod-unity",
    "gsplat-convert-ffi",
]
resolver = "2"

[workspace.package]
rust-version = "1.82"
edition = "2021"
license = "MIT"
authors = ["World Labs Technologies"]
repository = "https://github.com/sparkjsdev/spark"

[workspace.dependencies]
ahash = { version = "0.8.12", default-features = false, features = ["std", "compile-time-rng"] }
anyhow = "1.0.98"
glam = "0.30.8"
half = { version = "2.6.0", features = ["std"] }
itertools = "0.14.0"
miniz_oxide = "0.8.9"
ordered-float = "5.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smallvec = "1.15.1"
zip = { version = "7.0.0", default-features = false, features = ["deflate"] }
image = { version = "0.25.9", default-features = false, features = ["png", "webp"] }
hnsw = "0.11.0"
rand_pcg = "0.3.1"
space = { version = "0.17.0", default-features = false, features = ["alloc"] }
wgpu = "29"
pollster = "0.4.0"
bytemuck = { version = "1.25.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
